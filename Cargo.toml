[package]
name = "handl-plugin-sdkgen-backend-c"
version.workspace = true
edition.workspace = true
description = "C / libclang backend for the Handl SDK generator (ADR-0107)."
license.workspace = true
repository.workspace = true

[dependencies]
# ADR-0128 Phase 2: the sdkgen port stays in platform; this repo is the
# c target. The workspace-root `[patch]` resolves the git dep from the
# sibling `../platform` checkout for local development.
handl-plugin-sdkgen = { git = "https://github.com/handl-lang/platform", branch = "main" }
clang-sys = { version = "1.9", features = ["runtime", "clang_20_0"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
glob = "0.3"
heck = "0.5"
target-lexicon = "0.12"
flate2 = "1.1"
