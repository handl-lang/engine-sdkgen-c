[package]
name = "handl-plugin-sdkgen-backend-c"
version = "0.1.0"
edition = "2024"
description = "C / libclang backend for the Handl SDK generator (ADR-0107)."
license = "MIT"
repository = "https://github.com/handl-lang/tool-sdkgen-c"
readme = "README.md"
keywords = ["handl", "sdkgen", "c", "bindings"]
categories = ["development-tools"]

[dependencies]
# ADR-0128 Phase 2: the sdkgen port stays in platform; this repo is the
# c target. The workspace-root `[patch]` resolves the git dep from the
# sibling `../host` checkout for local development.
handl-plugin-sdkgen = { git = "https://github.com/handl-lang/host", branch = "main" }
clang-sys = { version = "1.9", features = ["runtime", "clang_20_0"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
glob = "0.3"
heck = "0.5"
target-lexicon = "0.12"
flate2 = "1.1"

[patch."https://github.com/handl-lang/engine"]
hnl-engine = { path = "../engine" }

[patch."https://github.com/handl-lang/kernel"]
handl-calculus = { path = "../kernel/crates/handl-calculus" }
handl-language = { path = "../kernel/crates/handl-language" }
handl-value = { path = "../kernel/crates/handl-value" }

[patch."https://github.com/handl-lang/host"]
handl-plugin-sdkgen = { path = "../host/crates/plugin-sdkgen" }
